<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Caribe Media — Panel de Operaciones</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body { margin: 0; padding: 0; }
  * { box-sizing: border-box; }
  #root { min-height: 100vh; }
  #boot-error, #lib-error {
    display:none; font-family: -apple-system, sans-serif;
    padding: 32px; color: #7f1d1d; background: #fef2f2;
    max-width: 640px; margin: 40px auto; border-radius: 8px; line-height: 1.6;
  }
  #boot-error { font-family: monospace; white-space: pre-wrap; max-width: 90%; }
  #lib-error code { background: #fee2e2; padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>
<div id="root"></div>
<div id="boot-error"></div>
<div id="lib-error"></div>

<script>
  window.__loadStatus = { react: false, reactDom: false };
  function reportLibError(which) {
    var el = document.getElementById("lib-error");
    el.style.display = "block";
    el.innerHTML =
      "<strong>No se pudo cargar <code>" + which + "</code> desde el CDN.</strong><br><br>" +
      "Esto casi siempre es un bloqueo de red: un antivirus, firewall corporativo, VPN o extensión del navegador " +
      "está impidiendo la descarga de librerías externas. Prueba abriendo el archivo desde otra red (datos móviles, otra wifi), " +
      "o desactivando temporalmente extensiones tipo ad-blocker para esta página.";
  }
</script>

<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"
        onload="window.__loadStatus.react = true;"
        onerror="reportLibError('react')"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"
        onload="window.__loadStatus.reactDom = true;"
        onerror="reportLibError('react-dom')"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>

<script>
  if (typeof React === "undefined") reportLibError("react");
  else if (typeof ReactDOM === "undefined") reportLibError("react-dom");
</script>

<script>
// ─── EXPORTAR PLAN DE CONTENIDO A PPTX ──────────────────────────────────────
window.exportarContenidoPPTX = function(clienteData) {
  if (typeof PptxGenJS === "undefined") {
    alert("La librería PptxGenJS no cargó todavía. Intenta de nuevo en unos segundos.");
    return;
  }
  const C = {
    inkDark:  "1B3143", inkMid:   "3F5A73", teal:     "2B9FBA",
    tealDeep: "1E7C90", coral:    "DE6B2C", paper:    "F3F6F5",
    white:    "FFFFFF", lineGray: "DDE3E1", textMuted:"7A9BAF",
  };
  const ECOLORS = {
    "Educativo":         { h:"2B9FBA", b:"D6EFF5", i:"📚" },
    "Dato curioso":      { h:"5A4A8A", b:"E4DFF2", i:"💡" },
    "Confianza":         { h:"1E7C90", b:"D4EFE9", i:"🤝" },
    "Autoridad":         { h:"2E7D5B", b:"D8F0E2", i:"⭐" },
    "Casos de éxito":    { h:"9C7A2E", b:"F7EDCF", i:"🏆" },
    "Problema/Solución": { h:"A85440", b:"F5DDD6", i:"💪" },
  };
  function ec(e){ return ECOLORS[e] || {h:C.inkMid,b:C.paper,i:"📋"}; }
  function trunc(t,n){ if(!t)return "—"; return t.length>n?t.slice(0,n-3)+"…":t; }

  const pres = new PptxGenJS();
  pres.layout = "LAYOUT_16x9";
  const W=10, H=5.625;

  const postsOk = (clienteData.posts||[]).filter(p=>p.incluir!==false);
  const total   = postsOk.length;

  const mesLabel = clienteData.mes
    ? (()=>{try{return new Date(clienteData.mes+"-15").toLocaleDateString("es-DO",{month:"long",year:"numeric"});}catch(e){return clienteData.mes;}})()
    : "";

  // ── PORTADA ──
  const port = pres.addSlide();
  port.background = {color:C.inkDark};
  port.addShape(pres.ShapeType.rect,{x:0,y:0,w:.18,h:H,fill:{color:C.teal},line:{type:"none"}});
  port.addShape(pres.ShapeType.rect,{x:.18,y:0,w:.04,h:H,fill:{color:C.tealDeep},line:{type:"none"}});
  port.addShape(pres.ShapeType.rect,{x:.5,y:1.6,w:7.2,h:1.0,fill:{color:C.teal,transparency:85},line:{type:"none"}});
  port.addText("CARIBE MEDIA",{x:.5,y:.35,w:5,h:.45,fontSize:11,bold:true,color:C.teal,fontFace:"Calibri",isTextBox:true,margin:0,charSpacing:6});
  port.addText(clienteData.name,{x:.5,y:1.55,w:8.5,h:1.1,fontSize:36,bold:true,color:C.white,fontFace:"Calibri",isTextBox:true,margin:0,wrap:true});
  port.addText(clienteData.sistema+"  ·  "+mesLabel,{x:.5,y:2.85,w:8,h:.4,fontSize:13,color:C.textMuted,fontFace:"Calibri",isTextBox:true,margin:0});
  [{l:"CM",v:clienteData.cm},{l:"SMM",v:clienteData.smm},{l:"Diseñador",v:clienteData.disenador},{l:"Nivel",v:clienteData.nivel}].forEach((ch,i)=>{
    const cx=.5+i*2.2;
    port.addShape(pres.ShapeType.roundRect,{x:cx,y:3.55,w:1.9,h:.5,fill:{color:C.inkMid,transparency:40},line:{color:C.teal,width:1},rectRadius:.05});
    port.addText(ch.l+"\n"+ch.v,{x:cx+.05,y:3.55,w:1.8,h:.5,fontSize:8.5,color:C.white,fontFace:"Calibri",isTextBox:true,margin:0,align:"center",valign:"middle"});
  });
  port.addShape(pres.ShapeType.rect,{x:.5,y:4.3,w:9,h:.02,fill:{color:C.teal,transparency:50},line:{type:"none"}});
  port.addText(total+" publicaciones · Plan de contenido",{x:.5,y:4.45,w:9,h:.35,fontSize:10,color:C.textMuted,fontFace:"Calibri",isTextBox:true,margin:0});

  // ── SLIDES DE POSTS ──
  postsOk.forEach((post,idx)=>{
    const e = ec(post.estructura);
    const sl = pres.addSlide();
    sl.background = {color:C.paper};
    sl.addShape(pres.ShapeType.rect,{x:0,y:0,w:.14,h:H,fill:{color:e.h},line:{type:"none"}});
    sl.addShape(pres.ShapeType.rect,{x:.14,y:0,w:W-.14,h:.75,fill:{color:C.inkDark},line:{type:"none"}});

    sl.addText(String(idx+1).padStart(2,"0"),{x:.2,y:0,w:.8,h:.75,fontSize:26,bold:true,color:e.h,fontFace:"Calibri",isTextBox:true,margin:0,align:"center",valign:"middle"});
    sl.addText(post.archivo||("Post "+String(idx+1).padStart(2,"0")),{x:1.1,y:.05,w:6.2,h:.4,fontSize:12,bold:true,color:C.white,fontFace:"Calibri",isTextBox:true,margin:0,valign:"bottom"});
    sl.addText(clienteData.name,{x:1.1,y:.44,w:6.2,h:.28,fontSize:9,color:C.textMuted,fontFace:"Calibri",isTextBox:true,margin:0});
    sl.addShape(pres.ShapeType.roundRect,{x:7.5,y:.12,w:2.3,h:.5,fill:{color:e.h,transparency:15},line:{type:"none"},rectRadius:.05});
    sl.addText(e.i+"  "+(post.estructura||""),{x:7.5,y:.12,w:2.3,h:.5,fontSize:9,bold:true,color:C.white,fontFace:"Calibri",isTextBox:true,margin:0,align:"center",valign:"middle"});

    const lx=.28,lw=5.4,rx=5.85,rw=3.9,cy=.9;
    // TEMA
    sl.addShape(pres.ShapeType.rect,{x:lx,y:cy,w:.6,h:.26,fill:{color:e.h},line:{type:"none"}});
    sl.addText("TEMA",{x:lx,y:cy,w:.6,h:.26,fontSize:7.5,bold:true,color:C.white,fontFace:"Calibri",isTextBox:true,margin:0,align:"center",valign:"middle"});
    sl.addText(trunc(post.tema,80),{x:lx+.68,y:cy,w:lw-.68,h:.28,fontSize:11,bold:true,color:C.inkDark,fontFace:"Calibri",isTextBox:true,margin:0,valign:"middle"});
    sl.addShape(pres.ShapeType.rect,{x:lx,y:cy+.3,w:lw,h:.012,fill:{color:C.lineGray},line:{type:"none"}});
    // COPY label
    sl.addShape(pres.ShapeType.rect,{x:lx,y:cy+.38,w:.6,h:.26,fill:{color:C.teal},line:{type:"none"}});
    sl.addText("COPY",{x:lx,y:cy+.38,w:.6,h:.26,fontSize:7.5,bold:true,color:C.white,fontFace:"Calibri",isTextBox:true,margin:0,align:"center",valign:"middle"});
    // COPY box
    const cbY=cy+.7,cbH=2.85;
    sl.addShape(pres.ShapeType.roundRect,{x:lx,y:cbY,w:lw,h:cbH,fill:{color:C.white},line:{color:C.lineGray,width:1},rectRadius:.05});
    sl.addText(trunc(post.copy,520),{x:lx+.12,y:cbY+.1,w:lw-.24,h:cbH-.2,fontSize:10,color:C.inkDark,fontFace:"Calibri",isTextBox:true,margin:0,wrap:true,valign:"top"});
    sl.addText("Post "+(post.numeroPost||idx+1)+" de "+total+"  ·  "+(clienteData.mes||""),{x:lx,y:H-.38,w:lw,h:.28,fontSize:8,color:C.textMuted,fontFace:"Calibri",isTextBox:true,margin:0});

    // INSUMO
    const chH=1.05,chG=.15;
    sl.addShape(pres.ShapeType.roundRect,{x:rx,y:cy,w:rw,h:chH,fill:{color:C.white},line:{color:e.h,width:1.5},rectRadius:.05});
    sl.addShape(pres.ShapeType.roundRect,{x:rx,y:cy,w:rw,h:.28,fill:{color:e.h},line:{type:"none"},rectRadius:.05});
    sl.addShape(pres.ShapeType.rect,{x:rx,y:cy+.15,w:rw,h:.13,fill:{color:e.h},line:{type:"none"}});
    sl.addText("📦  INSUMO",{x:rx+.1,y:cy,w:rw-.2,h:.28,fontSize:8.5,bold:true,color:C.white,fontFace:"Calibri",isTextBox:true,margin:0,valign:"middle"});
    sl.addText(trunc(post.insumo,120),{x:rx+.1,y:cy+.32,w:rw-.2,h:chH-.36,fontSize:9,color:C.inkDark,fontFace:"Calibri",isTextBox:true,margin:0,wrap:true,valign:"top"});
    // REFERENCIA
    const rfY=cy+chH+chG;
    sl.addShape(pres.ShapeType.roundRect,{x:rx,y:rfY,w:rw,h:.7,fill:{color:C.white},line:{color:C.lineGray,width:1},rectRadius:.05});
    sl.addText("🔗  REFERENCIA",{x:rx+.1,y:rfY+.06,w:rw-.2,h:.22,fontSize:8,bold:true,color:C.inkMid,fontFace:"Calibri",isTextBox:true,margin:0});
    sl.addText(trunc(post.referencia||"Sin referencia",80),{x:rx+.1,y:rfY+.3,w:rw-.2,h:.32,fontSize:8.5,color:C.tealDeep,fontFace:"Calibri",isTextBox:true,margin:0});
    // COMENTARIO DISEÑADOR
    const cmY=rfY+.7+chG,cmH=1.85;
    sl.addShape(pres.ShapeType.roundRect,{x:rx,y:cmY,w:rw,h:cmH,fill:{color:"FFF8F0"},line:{color:C.coral,width:1.5},rectRadius:.05});
    sl.addShape(pres.ShapeType.roundRect,{x:rx,y:cmY,w:rw,h:.28,fill:{color:C.coral},line:{type:"none"},rectRadius:.05});
    sl.addShape(pres.ShapeType.rect,{x:rx,y:cmY+.15,w:rw,h:.13,fill:{color:C.coral},line:{type:"none"}});
    sl.addText("🎨  COMENTARIO AL DISEÑADOR",{x:rx+.1,y:cmY,w:rw-.2,h:.28,fontSize:7.5,bold:true,color:C.white,fontFace:"Calibri",isTextBox:true,margin:0,valign:"middle"});
    sl.addText(trunc(post.comentarioDisenador||"Sin comentarios adicionales.",200),{x:rx+.1,y:cmY+.33,w:rw-.2,h:cmH-.38,fontSize:9,color:C.inkDark,fontFace:"Calibri",isTextBox:true,margin:0,wrap:true,valign:"top"});
    sl.addText("CM: "+clienteData.cm+"  ·  SMM: "+clienteData.smm+"  ·  Diseñador: "+(post.disenadorAsignado||clienteData.disenador),{x:rx,y:H-.38,w:rw,h:.28,fontSize:7.5,color:C.textMuted,fontFace:"Calibri",isTextBox:true,margin:0,align:"right"});
  });

  // ── SLIDE CIERRE ──
  const cl = pres.addSlide();
  cl.background = {color:C.inkDark};
  cl.addShape(pres.ShapeType.rect,{x:0,y:0,w:.18,h:H,fill:{color:C.teal},line:{type:"none"}});
  cl.addShape(pres.ShapeType.rect,{x:.18,y:0,w:.04,h:H,fill:{color:C.tealDeep},line:{type:"none"}});
  cl.addShape(pres.ShapeType.rect,{x:6.5,y:0,w:3.5,h:H,fill:{color:C.teal,transparency:92},line:{type:"none"}});
  cl.addText("✅",{x:3.5,y:1.3,w:1.2,h:1.0,fontSize:44,isTextBox:true,margin:0,align:"center"});
  cl.addText("¡Plan de contenido listo!",{x:.5,y:2.4,w:9,h:.65,fontSize:28,bold:true,color:C.white,fontFace:"Calibri",isTextBox:true,margin:0,align:"center"});
  cl.addText(clienteData.name,{x:.5,y:3.1,w:9,h:.45,fontSize:15,color:C.teal,fontFace:"Calibri",isTextBox:true,margin:0,align:"center"});
  cl.addText(total+" publicaciones  ·  "+mesLabel,{x:.5,y:3.65,w:9,h:.35,fontSize:11,color:C.textMuted,fontFace:"Calibri",isTextBox:true,margin:0,align:"center"});
  cl.addShape(pres.ShapeType.rect,{x:3,y:4.15,w:4,h:.02,fill:{color:C.teal,transparency:50},line:{type:"none"}});
  cl.addText("Caribe Media — Agencia de Social Media",{x:.5,y:4.3,w:9,h:.3,fontSize:9,color:C.textMuted,fontFace:"Calibri",isTextBox:true,margin:0,align:"center"});

  const fname = "PlanContenido_"+clienteData.name.replace(/[^a-zA-Z0-9]/g,"_")+"_"+(clienteData.mes||"")+"_v1.pptx";
  pres.writeFile({fileName:fname});
};
